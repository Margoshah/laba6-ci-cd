name: CI Pipeline Margarita

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    # ПУНКТ 1: Матрица стратегий (запуск на 3-х ОС одновременно)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # ПУНКТ 5: Кэширование зависимостей (ускоряет сборку)
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx pytest-asyncio allure-pytest behave uvicorn

      # ПУНКТ 5: Кэширование браузеров Playwright
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Start Server
        # Используем универсальный запуск для всех ОС
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
        shell: bash

      - name: Wait for server
        run: sleep 5
        shell: bash

      # ПУНКТ 2: Запуск тестов (Unit, BDD, UI отдельно)
      - name: Run Unit Tests
        run: pytest tests/test_ticketprice.py --alluredir=allure-results
        continue-on-error: true

      - name: Run BDD Tests
        run: behave features/ticket.feature
        continue-on-error: true

      - name: Run UI Tests
        run: pytest tests/test_ticket.py --alluredir=allure-results
        continue-on-error: true

      # ПУНКТ 3: Сохранение результатов как артефактов
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}
          path: allure-results/

  # Новая работа для генерации отчета и уведомлений
  report-and-notify:
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Ubuntu Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ubuntu-latest
          path: allure-results
        continue-on-error: true

      - name: Download Windows Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-windows-latest
          path: allure-results
        continue-on-error: true

      - name: Download MacOS Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-macos-latest
          path: allure-results
        continue-on-error: true

      # Теперь Allure увидит общую папку allure-results
      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 CI Pipeline завершен!
            Студент: Маргарита Бартош
            Результат: ${{ needs.tests.result }}
            Ссылка на отчет: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/